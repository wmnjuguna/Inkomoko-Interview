name: inkomoko-fineract

services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FINERACT_DB_USER: ${FINERACT_DB_USER}
      FINERACT_DB_PASSWORD: ${FINERACT_DB_PASSWORD}
      INTEGRATION_DB_USER: ${INTEGRATION_DB_USER}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD}
      ERP_DB_USER: ${ERP_DB_USER}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD}
    volumes:
      - ./infra/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fineract:
    build:
      context: ./fineract-customization
    image: fineract-inkomoko:1.15.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tenant registry database
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: ${FINERACT_DB_USER}
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD}
      # Default tenant: written into fineract_tenants on first boot, then used to migrate fineract_default
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: ${FINERACT_DB_USER}
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Inkomoko assessment tenant
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Africa/Kigali
      FINERACT_DEFAULT_TENANTDB_MASTER_PASSWORD: ${FINERACT_MASTER_PASSWORD}
      # Plain HTTP inside the compose network only; the port is bound to localhost
      FINERACT_SERVER_PORT: "8080"
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_NODE_ID: "1"
      FINERACT_CONTENT_FILESYSTEM_ROOT_FOLDER: /tmp
      # Swagger UI: offer Fineract's own spec and the ERP accounts plugin spec in one dropdown
      SPRINGDOC_SWAGGERUI_URLS_0_NAME: Fineract 1.15.0
      SPRINGDOC_SWAGGERUI_URLS_0_URL: /fineract.json
      SPRINGDOC_SWAGGERUI_URLS_1_NAME: ERP integration (glsync plugin)
      SPRINGDOC_SWAGGERUI_URLS_1_URL: /glsync.json
      SPRINGDOC_SWAGGERUI_URLSPRIMARYNAME: Fineract 1.15.0
      JAVA_TOOL_OPTIONS: >-
        -Xmx2g -XX:+UseContainerSupport
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.management/javax.management=ALL-UNNAMED
        --add-opens=java.naming/javax.naming=ALL-UNNAMED
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/fineract-provider/actuator/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  mock-erp:
    build:
      context: ./mock-erp
    image: mock-erp-inkomoko:0.1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The entrypoint runs alembic upgrade head against this database before gunicorn starts
      ERP_DATABASE_URL: postgresql+psycopg://${ERP_DB_USER}:${ERP_DB_PASSWORD}@db:5432/erp_db
      ERP_API_KEY: ${ERP_API_KEY}
      ERP_LOG_LEVEL: ${ERP_LOG_LEVEL}
      # Seconds the "timeout" fault waits before answering
      ERP_TIMEOUT_DELAY: ${ERP_TIMEOUT_DELAY}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot Fineract setup (Part B): office, RWF, role, API user, GL sync of the ERP
  # chart, then the loan product. Safe to run again. Uses Fineract's admin user.
  setup:
    image: integration-service-inkomoko:0.1.0
    # The entrypoint runs alembic upgrade head first (GL sync writes to integration_db)
    command: ["python", "-m", "integration_service.setup"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    environment:
      INTEGRATION_DATABASE_URL: postgresql+psycopg://${INTEGRATION_DB_USER}:${INTEGRATION_DB_PASSWORD}@db:5432/integration_db
      FINERACT_BASE_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_ADMIN_USERNAME: ${FINERACT_ADMIN_USER}
      FINERACT_ADMIN_PASSWORD: ${FINERACT_ADMIN_PASSWORD}
      # The API user setup creates; the integration-service logs in as it
      FINERACT_API_USERNAME: ${FINERACT_API_USERNAME}
      FINERACT_API_PASSWORD: ${FINERACT_API_PASSWORD}
      FINERACT_TIMEOUT_SECONDS: ${INTEGRATION_FINERACT_TIMEOUT_SECONDS:-30}
      ERP_BASE_URL: http://mock-erp:8090
      ERP_API_KEY: ${ERP_API_KEY}
      FINERACT_SETUP_CONFIG_DIR: /app/fineract-configuration
    volumes:
      - ./fineract/configuration:/app/fineract-configuration:ro

  integration-service:
    build:
      context: ./integration-service
    image: integration-service-inkomoko:0.1.0
    # Starts only after setup has made the Fineract API user it logs in as.
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      fineract:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    environment:
      # The entrypoint runs alembic upgrade head against this database before gunicorn starts
      INTEGRATION_DATABASE_URL: postgresql+psycopg://${INTEGRATION_DB_USER}:${INTEGRATION_DB_PASSWORD}@db:5432/integration_db
      # name:key pairs, comma separated, one per partner
      PARTNER_API_KEYS: ${PARTNER_API_KEYS}
      LOG_LEVEL: ${INTEGRATION_LOG_LEVEL}
      # Least-privilege Fineract API user, never the admin
      FINERACT_BASE_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT: default
      FINERACT_USERNAME: ${FINERACT_API_USERNAME}
      FINERACT_PASSWORD: ${FINERACT_API_PASSWORD}
      FINERACT_TIMEOUT_SECONDS: ${INTEGRATION_FINERACT_TIMEOUT_SECONDS:-30}
      ERP_BASE_URL: http://mock-erp:8090
      ERP_API_KEY: ${ERP_API_KEY}
      # Journal entries use the GL accounts the loan product maps each role to (Part H)
      GL_ROLES_CONFIG_PATH: /app/fineract-configuration/loan-product.json
      # The outbox sender and recovery loop, one per gunicorn worker
      OUTBOX_ENABLED: ${INTEGRATION_OUTBOX_ENABLED:-true}
      OUTBOX_POLL_SECONDS: ${INTEGRATION_OUTBOX_POLL_SECONDS:-5}
      OUTBOX_MAX_ATTEMPTS: ${INTEGRATION_OUTBOX_MAX_ATTEMPTS:-8}
    volumes:
      - ./fineract/configuration:/app/fineract-configuration:ro
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
