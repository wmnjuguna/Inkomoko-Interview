openapi: 3.1.0
info:
  title: Integration Service
  description: The only API partners call. Syncs the ERP chart of accounts to Fineract, and runs clients,
    loans and payments through Fineract and the ERP.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Database reachable
      operationId: health_health_health_get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorResponse'
  /api/accounts/sync:
    get:
      tags:
      - gl-sync
      summary: GL sync state
      description: The state of every ERP account known to the sync. Calls nothing.
      operationId: gl_sync_sync_report_api_accounts_sync_get
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncReportResponse'
      security:
      - api_key: []
    post:
      tags:
      - gl-sync
      summary: Sync the ERP chart of accounts to Fineract
      description: 'Creates in Fineract every ERP account not synced yet, parents first. Safe to call
        again: synced accounts are not sent again, and pending or failed ones are retried. If a sync is
        already running, answers 202 with the current state and in_progress true.'
      operationId: gl_sync_run_sync_api_accounts_sync_post
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncReportResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncReportResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/accounts/{erp_reference}/sync:
    post:
      tags:
      - gl-sync
      summary: Sync one ERP account to Fineract
      description: Creates the account in Fineract if it is not synced yet. Its parent must be SYNCED
        already. Safe to call again. If a sync is already running, answers 202 with the account's current
        state (null if never recorded) and in_progress true.
      operationId: gl_sync_run_sync_one_api_accounts__erp_reference__sync_post
      parameters:
      - name: erp_reference
        in: path
        description: The ERP account's external_reference, e.g. GL-1200
        required: true
        schema:
          title: Erp Reference
          type: string
          description: The ERP account's external_reference, e.g. GL-1200
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSyncResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSyncResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/transactions/{external_reference}:
    get:
      tags:
      - transactions
      summary: Status and history of one request
      description: 'Every operation you sent with this external_reference: its type, status, ERP status,
        attempts, last error and status history. Use it to learn the live status of a request whose repeat
        returned the saved first answer.'
      operationId: transactions_get_transaction_api_transactions__external_reference__get
      parameters:
      - name: external_reference
        in: path
        required: true
        schema:
          title: External Reference
          maxLength: 40
          minLength: 1
          pattern: ^[A-Za-z0-9._:\-]{1,40}$
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/clients:
    post:
      tags:
      - clients
      summary: Create a client
      description: Creates the client in Fineract, active from today, keyed by client_uid. 201 the first
        time. The same external_reference and data again gives 200 with the same body; with other data,
        409 IDEMPOTENCY_CONFLICT. A client_uid already used by another reference gives 409 CLIENT_UID_TAKEN.
      operationId: clients_post_client_api_clients_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/clients/{client_uid}:
    get:
      tags:
      - clients
      summary: Check a client
      description: 'Reads Fineract: does the client exist, is it active, and does it have the name we
        recorded? Add ?name= to check the name you expect.'
      operationId: clients_get_client_api_clients__client_uid__get
      parameters:
      - name: client_uid
        in: path
        required: true
        schema:
          title: Client Uid
          pattern: ^[A-Z]{2,10}-[0-9]{6}$
          type: string
      - name: name
        in: query
        description: 'Optional: the name you expect. name_matches says whether Fineract agrees (case and
          spacing ignored).'
        required: false
        schema:
          title: Name
          anyOf:
          - maxLength: 101
            type: string
          - type: 'null'
          description: 'Optional: the name you expect. name_matches says whether Fineract agrees (case
            and spacing ignored).'
          default: null
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCheckResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/loans:
    post:
      tags:
      - loans
      summary: Apply for a loan
      description: Submits a loan application in Fineract for an existing client, on the SME Asset Finance
        product (its term, rate and schedule). Returns the new loan_reference. 201 the first time; the
        same external_reference and data again gives 200 with the same body (the same loan_reference).
      operationId: loans_post_loan_api_loans_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/loans/{loan_reference}/approve:
    post:
      tags:
      - loans
      summary: Approve a loan
      description: 'Approves the loan in Fineract for its full principal. A loan is approved once: another
        external_reference for the same loan gives 409 LOAN_ALREADY_APPROVED.'
      operationId: loans_post_approval_api_loans__loan_reference__approve_post
      parameters:
      - name: loan_reference
        in: path
        required: true
        schema:
          title: Loan Reference
          pattern: ^LN-[0-9]{4}-[0-9]{6}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/loans/{loan_reference}:
    get:
      tags:
      - loans
      summary: Loan status and balances
      description: The loan's status and balances as Fineract reports them right now, in whole RWF. balances
        is null until the loan is disbursed.
      operationId: loans_get_loan_api_loans__loan_reference__get
      parameters:
      - name: loan_reference
        in: path
        required: true
        schema:
          title: Loan Reference
          pattern: ^LN-[0-9]{4}-[0-9]{6}$
          type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/loans/{loan_reference}/disburse:
    post:
      tags:
      - loans
      summary: Pay out a loan
      description: Pays out the loan's full approved principal in Fineract, once. The answer comes from
        Fineract's own transaction; its journal entry goes to the ERP through the outbox (erp_status).
        Another external_reference for the same loan gives 409 LOAN_ALREADY_DISBURSED, also while the
        first one is still running.
      operationId: loans_post_disbursement_api_loans__loan_reference__disburse_post
      parameters:
      - name: loan_reference
        in: path
        required: true
        schema:
          title: Loan Reference
          pattern: ^LN-[0-9]{4}-[0-9]{6}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisbursementRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /api/loans/{loan_reference}/repayments:
    post:
      tags:
      - loans
      summary: Record a repayment
      description: Records a repayment in Fineract while the loan is ACTIVE. The split into principal,
        interest and overpayment is Fineract's own; its journal entry goes to the ERP through the outbox
        (erp_status). A loan takes many repayments, one per external_reference.
      operationId: loans_post_repayment_api_loans__loan_reference__repayments_post
      parameters:
      - name: loan_reference
        in: path
        required: true
        schema:
          title: Loan Reference
          pattern: ^LN-[0-9]{4}-[0-9]{6}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepaymentRequest'
        required: true
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
  /admin/recover:
    post:
      tags:
      - admin
      summary: Re-check unfinished requests now
      description: Looks up every request still waiting on Fineract (older than the stale limit, or due
        again) by its externalId and finishes, fails or keeps it; then sends due journal entries to the
        ERP. Counts only. Not for partners.
      operationId: admin_recover_admin_recover_post
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResponse'
      security:
      - api_key: []
components:
  schemas:
    Health:
      title: Health
      required:
      - status
      - database
      type: object
      properties:
        status:
          title: Status
          enum:
          - UP
          - DOWN
          type: string
        database:
          title: Database
          enum:
          - ok
          - unreachable
          type: string
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      description: Every error has this shape.
    ErrorDetail:
      title: ErrorDetail
      required:
      - code
      - message
      - correlation_id
      - details
      type: object
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        correlation_id:
          title: Correlation Id
          anyOf:
          - type: string
          - type: 'null'
        details:
          title: Details
          type: object
          additionalProperties: true
    SyncReportResponse:
      title: SyncReportResponse
      required:
      - accounts
      - counts
      - writes
      - in_progress
      type: object
      properties:
        accounts:
          title: Accounts
          type: array
          items:
            $ref: '#/components/schemas/AccountSyncItem'
        counts:
          $ref: '#/components/schemas/SyncCounts'
        writes:
          title: Writes
          type: integer
          description: Accounts sent to Fineract by this call. 0 for GET.
        in_progress:
          title: In Progress
          type: boolean
          description: True (HTTP 202) when another sync was already running. This call changed nothing.
    AccountSyncItem:
      title: AccountSyncItem
      required:
      - erp_reference
      - code
      - name
      - status
      - attempts
      - last_error
      type: object
      properties:
        erp_reference:
          title: Erp Reference
          type: string
          description: The ERP account's external_reference, e.g. GL-1200
        code:
          title: Code
          type: string
          description: The ERP account code, also the GL code in Fineract
        name:
          title: Name
          type: string
        status:
          title: Status
          enum:
          - SYNC_PENDING
          - SYNCED
          - FAILED
          type: string
        attempts:
          title: Attempts
          type: integer
          description: How many times it was sent to Fineract
        last_error:
          title: Last Error
          anyOf:
          - type: string
          - type: 'null'
          description: 'Why it is not SYNCED. On a SYNCED account: a warning, e.g. that the ERP changed
            it after the sync (updates are out of scope).'
    SyncCounts:
      title: SyncCounts
      required:
      - SYNCED
      - SYNC_PENDING
      - FAILED
      type: object
      properties:
        SYNCED:
          title: Synced
          type: integer
        SYNC_PENDING:
          title: Sync Pending
          type: integer
        FAILED:
          title: Failed
          type: integer
    AccountSyncResponse:
      title: AccountSyncResponse
      required:
      - account
      - in_progress
      type: object
      properties:
        account:
          anyOf:
          - $ref: '#/components/schemas/AccountSyncItem'
          - type: 'null'
          description: The account's state. null only when a sync is running (202) and this account was
            never recorded.
        in_progress:
          title: In Progress
          type: boolean
          description: True (HTTP 202) when another sync was already running. This call changed nothing.
    TransactionResponse:
      title: TransactionResponse
      required:
      - external_reference
      - operations
      type: object
      properties:
        external_reference:
          title: External Reference
          type: string
        operations:
          title: Operations
          type: array
          items:
            $ref: '#/components/schemas/OperationStatus'
    HistoryEntry:
      title: HistoryEntry
      required:
      - from
      - to
      - at
      - detail
      type: object
      properties:
        from:
          title: From
          anyOf:
          - type: string
          - type: 'null'
        to:
          title: To
          type: string
        at:
          title: At
          type: string
          format: date-time
        detail:
          title: Detail
          anyOf:
          - type: string
          - type: 'null'
    OperationStatus:
      title: OperationStatus
      required:
      - type
      - op_key
      - status
      - erp_status
      - client_uid
      - loan_reference
      - attempts
      - last_error
      - history
      - created_at
      - updated_at
      type: object
      properties:
        type:
          title: Type
          type: string
